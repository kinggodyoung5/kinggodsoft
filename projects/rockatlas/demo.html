<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROCK ATLAS</title>
  <link rel="stylesheet" href="../../assets/style.css" />
  <style>
    .overview {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .overview-card {
      max-width: 480px;
      text-align: center;
    }
    .overview-eyebrow {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 14px;
    }
    .overview-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 14px;
    }
    .overview-card p {
      color: var(--text-sub);
      font-size: 0.92rem;
      line-height: 1.65;
      margin: 0 0 26px;
    }
    .overview-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .overview-tags span {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
    }
    .overview-card .btn {
      font-size: 0.88rem;
      padding: 12px 22px;
      border-color: var(--border-strong);
    }
    .overview-card .btn:hover {
      background: var(--accent-dim);
    }
  </style>
</head>
<body>
  <div class="overview">
    <div class="overview-card">
      <p class="overview-eyebrow">Live Site</p>
      <h1>ROCK ATLAS</h1>
      <p>
        장르·분위기 기준으로 록 밴드를 탐색하는 아카이브 사이트.
        "지금 밴드에서 더 무겁게 / 더 몽환적으로" 같은 방향을 골라
        다음 밴드로 넘어가는 히치하이킹 추천이 핵심 기능입니다.
      </p>
      <div class="overview-tags">
        <span>React + TypeScript</span>
        <span>GitHub Pages</span>
        <span>200+ 밴드</span>
      </div>
      <a class="btn" href="https://kinggodyoung5.github.io/rockatlas/" target="_blank" rel="noopener">
        실제 사이트 바로가기 ↗
      </a>
    </div>
  </div>
</body>
</html>
