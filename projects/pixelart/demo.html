<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>픽셀아트 스튜디오</title>
  <link rel="stylesheet" href="../../assets/style.css" />
  <style>
    .overview {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .overview-card {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .overview-eyebrow {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 12px;
    }
    .overview-card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 18px;
    }

    /* 실제 사이트를 그대로 축소해서 보여주는 라이브 미리보기.
       스크린샷 대신 iframe을 스케일해서 넣기 때문에 원본이 바뀌면 여기도 자동으로 최신 상태를 보여준다. */
    .live-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-elevated);
      margin-bottom: 18px;
    }
    .live-preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1400px;
      border: 0;
      transform-origin: top left;
      pointer-events: none;
    }
    .live-preview-link {
      position: absolute;
      inset: 0;
      display: block;
    }
    .live-preview-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: var(--text-sub);
      background: rgba(9, 9, 11, 0.7);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      pointer-events: none;
    }

    .overview-card p.desc {
      color: var(--text-sub);
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 22px;
    }
    .overview-card .btn {
      font-size: 0.88rem;
      padding: 12px 22px;
      border-color: var(--border-strong);
    }
    .overview-card .btn:hover {
      background: var(--accent-dim);
    }
  </style>
</head>
<body>
  <div class="overview">
    <div class="overview-card">
      <p class="overview-eyebrow">Tool</p>
      <h1>픽셀아트 스튜디오</h1>

      <div class="live-preview" id="livePreview">
        <span class="live-preview-badge">실시간 미리보기</span>
        <iframe
          id="previewFrame"
          src="https://kinggodyoung5.github.io/pixel_art/pixelart_studio.html"
          title="픽셀아트 스튜디오 미리보기"
          loading="lazy"
        ></iframe>
        <a
          class="live-preview-link"
          href="https://kinggodyoung5.github.io/pixel_art/pixelart_studio.html"
          target="_blank"
          rel="noopener"
          aria-label="픽셀아트 스튜디오 실제 사이트 열기"
        ></a>
      </div>

      <p class="desc">이미지를 업로드하면 번호 색칠 학습지로 자동 변환해주는 도구입니다.</p>

      <a class="btn" href="https://kinggodyoung5.github.io/pixel_art/pixelart_studio.html" target="_blank" rel="noopener">
        도구 바로가기 ↗
      </a>
    </div>
  </div>

  <script>
    // iframe을 실제 크기(1400px 폭 기준)로 그린 뒤 박스 폭에 맞게 스케일만 축소한다.
    // (진짜 화면 그대로 축소되는 것이지, 반응형으로 다시 배치되는 게 아님)
    const DESIGN_WIDTH = 1400;
    const wrap = document.getElementById("livePreview");
    const frame = document.getElementById("previewFrame");

    function fit() {
      const boxWidth = wrap.clientWidth;
      const boxHeight = wrap.clientHeight;
      const scale = boxWidth / DESIGN_WIDTH;
      frame.style.height = boxHeight / scale + "px";
      frame.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", fit);
    fit();
  </script>
</body>
</html>
